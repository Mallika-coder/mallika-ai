services:
  - type: web
    name: mallika-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mallika-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: mallika-db
          property: connectionString
      - key: REDIS_URL
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: CHROMA_PERSIST_DIR
        value: /tmp/vectorstores

databases:
  - name: mallika-db
    plan: free
    databaseName: mallika_ai
    user: mallika
