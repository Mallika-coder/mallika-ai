services:
  - type: web
    name: mallika-ai-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mallika-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: mallika-db
          property: connectionString
      - key: REDIS_URL
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://frontend-fbnsxsy53-web-booster12.vercel.app,chrome-extension://*

databases:
  - name: mallika-db
    plan: free
    databaseName: mallika_ai
    user: mallika
